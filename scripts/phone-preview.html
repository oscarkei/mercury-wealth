<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf1e9">
<title>Mercury Wealth · True-size Mobile Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1e9;color:#254b40;font-family:Arial,Helvetica,sans-serif}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #497e65;outline-offset:5px}header{height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 40px;border-bottom:1px solid #dce3d6;background:#f4f6f0}.identity{display:flex;align-items:center;gap:13px}.mark{font:42px Georgia;letter-spacing:-5px}.identity strong{display:block;font:15px Georgia;letter-spacing:2px}.identity small{display:block;font-size:9px;letter-spacing:1.8px;color:#73846d;margin-top:5px}.controls{display:flex;align-items:center;gap:20px}.controls a{font-size:11px;text-decoration:none}.controls a:hover{text-decoration:underline}.controls button{border:1px solid #cbd6c5;border-radius:6px;background:#f8faf5;padding:9px 12px;font-size:11px}.stage{height:calc(100dvh - 126px);min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#f8faf4 0,#edf1e9 65%)}.device-slot{position:relative;flex-shrink:0}.phone{width:414px;height:868px;position:relative;transform-origin:top left;border:2px solid #888e80;border-radius:61px;padding:10px;background:#1d231f;box-shadow:0 28px 45px -16px #203a303e,0 0 0 1px #aab2a3, inset 0 0 0 2px #3b4238}.phone:before{content:'';position:absolute;left:-5px;top:160px;width:3px;height:52px;background:#596250;border-radius:3px;box-shadow:0 66px 0 #596250,0 -65px 0 -1px #596250}.phone:after{content:'';position:absolute;right:-5px;top:206px;width:3px;height:82px;background:#596250;border-radius:3px}.screen{width:390px;height:844px;border-radius:48px;overflow:hidden;background:#f7f9f5;position:relative;display:flex;flex-direction:column}.status{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 27px 0;color:#193c35;position:relative}.time{font-size:14px;font-weight:600;letter-spacing:-.2px}.island{position:absolute;width:112px;height:31px;background:#131a15;top:11px;left:139px;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-right:11px}.island:after{content:'';height:7px;width:7px;border-radius:50%;background:#1c2f35;box-shadow:inset 0 0 0 2px #182326}.signals{display:flex;align-items:center;gap:6px}.signals svg{display:block}iframe{border:0;width:390px;height:760px;display:block;flex-shrink:0;background:#f7f9f5}.home-area{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding-top:6px;background:#fafcf7}.home-indicator{height:5px;width:126px;border-radius:5px;background:#263c30}footer{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;color:#74826a}footer i{width:5px;height:5px;border-radius:50%;background:#84a16e}.actual .stage{height:auto;min-height:916px;overflow:auto;padding:24px 20px;justify-content:flex-start}.actual .device-slot{margin:0 auto}.actual footer{height:44px}
@media(max-width:600px){header{height:72px;padding:0 18px;gap:12px}.identity strong{font-size:12px;letter-spacing:1px}.identity small{font-size:8px;letter-spacing:1px}.mark{font-size:35px}.controls{gap:12px}.controls a{font-size:10px}.controls button{padding:8px;font-size:10px}.stage{height:calc(100dvh - 116px)}footer{font-size:9px}.actual .stage{min-height:916px}}
@media(max-width:600px),(pointer:coarse){html,body{width:100%;height:100%;overflow:hidden}body>header,body>footer,.status,.home-area{display:none}.stage,.actual .stage{width:100%;height:100dvh;min-height:0;padding:0;overflow:hidden}.device-slot{width:100%!important;height:100dvh!important;margin:0!important}.phone{width:100%;height:100dvh;border:0;padding:0;border-radius:0;box-shadow:none;transform:none!important}.phone:before,.phone:after{display:none}.screen{width:100%;height:100dvh;border-radius:0}iframe{width:100%;height:100dvh;flex:1}}

#size-label{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
html[data-theme=dark] .screen,html[data-theme=dark] .status,html[data-theme=dark] .home-area{background:#181a1d;color:#f2f3f5}
html[data-theme=dark] .home-indicator{background:#f2f4ef}
@media(max-width:760px){#size-label{display:none}}
</style>
</head>
<body class="actual">
<header><div class="identity"><img src="/brand/mercury-black.png" alt="Mercury" style="width:150px;height:auto"><div><small>REV4 · INTERACTIVE MOBILE PREVIEW</small></div></div><div class="controls"><span id="size-label" aria-live="polite">390 × 844 · 100%</span><button id="size-toggle" aria-pressed="true">Fit to screen</button><a id="desktop-link" href="Mercury Wealth Interactive Demo.html">Open full screen ↗</a></div></header>
<main class="stage" aria-label="Interactive mobile preview"><div class="device-slot"><div class="phone"><div class="screen"><div class="status" aria-hidden="true"><span class="time">9:41</span><div class="island"></div><div class="signals"><svg width="17" height="13" viewBox="0 0 17 13" fill="currentColor"><rect x="0" y="9" width="3" height="4" rx=".8"/><rect x="4.5" y="6" width="3" height="7" rx=".8"/><rect x="9" y="3" width="3" height="10" rx=".8"/><rect x="13.5" y="0" width="3" height="13" rx=".8"/></svg><svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4a11 11 0 0 1 14 0M3.5 7a7 7 0 0 1 9 0M6 10a3 3 0 0 1 4 0"/><circle cx="8" cy="12" r=".6" fill="currentColor" stroke="none"/></svg><svg width="25" height="13" viewBox="0 0 25 13"><rect x="1" y="1" width="20" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><path d="M23 4.5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg></div></div><iframe id="portal" title="Mercury Wealth interactive mobile portal" src="Mercury Wealth Interactive Demo.html#overview"></iframe><div class="home-area" aria-hidden="true"><div class="home-indicator"></div></div></div></div></div></main>
<footer><i></i>390 × 844 screen · 1:1 at browser zoom 100% · Scroll and tap inside the phone</footer>
<script>
const stage=document.querySelector('.stage'),slot=document.querySelector('.device-slot'),phone=document.querySelector('.phone'),toggle=document.getElementById('size-toggle'),portal=document.getElementById('portal'),sizeLabel=document.getElementById('size-label');
const device={width:414,height:868,screenWidth:390,screenHeight:844};
let actual=true;
const requestedSize=new URLSearchParams(location.search).get('size');
try{actual=requestedSize==='actual'?true:requestedSize==='fit'?false:localStorage.getItem('mercury-phone-preview-size')!=='fit';}catch{}
function fit(){
 document.body.classList.toggle('actual',actual);
 toggle.setAttribute('aria-pressed',String(actual));
 toggle.textContent=actual?tr('Fit to screen','符合螢幕','适应屏幕'):tr('Actual size','原尺寸','原尺寸');
 if(matchMedia('(max-width:600px), (pointer:coarse)').matches){slot.style.width='100%';slot.style.height='100dvh';phone.style.transform='none';return;}
 const scale=actual?1:Math.max(.2,Math.min(1,(stage.clientHeight-34)/device.height,(stage.clientWidth-42)/device.width));
 slot.style.width=device.width*scale+'px';slot.style.height=device.height*scale+'px';phone.style.transform='scale('+scale+')';
 sizeLabel.textContent=device.screenWidth+' × '+device.screenHeight+' · '+Math.round(scale*100)+'%';
}
function destination(){const view=['overview','portfolio','products','simulator','insights','documents','chat'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';const url='Mercury Wealth Interactive Demo.html#'+view;portal.src=url;document.getElementById('desktop-link').href=url;}
function tr(en,hant,hans){const lang=document.documentElement.lang;return lang==='zh-Hant'?hant:lang==='zh-Hans'?hans:en;}
function theme(){try{const p=JSON.parse(localStorage.getItem('mercury-preferences')||'{}');document.documentElement.dataset.theme=p.theme==='dark'||(p.theme!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';document.documentElement.lang=p.language||'en';document.querySelector('.identity small').textContent=tr('REV4 · INTERACTIVE MOBILE PREVIEW','REV4 · 手機互動預覽','REV4 · 手机互动预览');document.getElementById('desktop-link').textContent=tr('Open full screen ↗','全螢幕開啟 ↗','全屏打开 ↗');document.querySelector('footer').textContent=tr('390 × 844 screen · 1:1 at browser zoom 100% · Scroll and tap inside the phone','390 × 844 畫面 · 瀏覽器縮放 100% 時為 1:1 · 可在手機內捲動及操作','390 × 844 画面 · 浏览器缩放 100% 时为 1:1 · 可在手机内滚动和操作');fit();}catch{}}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
toggle.addEventListener('click',()=>{actual=!actual;try{localStorage.setItem('mercury-phone-preview-size',actual?'actual':'fit');}catch{}fit();});
window.addEventListener('resize',fit);window.addEventListener('hashchange',destination);window.addEventListener('storage',theme);portal.addEventListener('load',theme);new ResizeObserver(fit).observe(stage);destination();theme();fit();
</script>
</body>
</html>
